name: Python CI

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: qweryTest001
          POSTGRES_DB: django_food_menu
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest-django pytest-html flake8 flake8-html

      - name: Run tests
        working-directory: djangoWebsite
        run: |
          pytest --html=test-report.html

      - name: Run flake8
        working-directory: djangoWebsite
        run: |
          flake8 . --format=html --htmldir=flake-report

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            djangoWebsite/test-report.html
            djangoWebsite/flake-report