name: Python CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: qweryTest001
          POSTGRES_DB: django_food_menu
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest-django pytest-html flake8 flake8-html

      - name: Run tests
        working-directory: djangoWebsite
        run: pytest --html=test-report.html

      - name: Run flake8
        working-directory: djangoWebsite
        run: flake8 . --format=html --htmldir=flake-report

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            djangoWebsite/test-report.html
            djangoWebsite/flake-report

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Install Heroku CLI
        run: curl https://cli-assets.heroku.com/install.sh | sh

      - name: Deploy to Heroku
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: |
          echo "machine git.heroku.com login heroku password $HEROKU_API_KEY" > ~/.netrc
          heroku git:remote -a ${{ secrets.HEROKU_APP_NAME }}
          git push heroku main --force